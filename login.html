<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | EduSmart AI</title>
  <style>
    :root {
      --primary-blue: #0056d2; /* Coursera Blue */
      --text-dark: #1f1f1f;
      --border-gray: #d1d7dc;
      --bg-gray: #ffffff;
    }

    body {
      background: var(--bg-gray);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 40px 20px;
      text-align: center;
    }

    h2 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-dark);
    }

    p.subtitle {
      color: #6a6f73;
      margin-bottom: 30px;
      font-size: 16px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 14px 12px;
      box-sizing: border-box;
      border: 1px solid var(--text-dark);
      font-size: 16px;
      transition: border 0.2s;
    }

    input:focus {
      outline: none;
      border: 2px solid var(--primary-blue);
      padding: 13px 11px; /* Adjust for border width change */
    }

    .login-btn {
      width: 100%;
      padding: 16px;
      background-color: var(--primary-blue);
      color: white;
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s;
    }

    .login-btn:hover {
      background-color: #00419e;
    }

    .divider {
      margin: 20px 0;
      display: flex;
      align-items: center;
      color: #6a6f73;
      font-size: 12px;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #d1d7dc;
      margin: 0 10px;
    }

    .social-btn {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--text-dark);
      background: white;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .error {
      color: #a30303;
      background: #fdf2f2;
      padding: 10px;
      font-size: 14px;
      margin-top: 15px;
      border-radius: 4px;
      display: none; /* Hidden by default */
    }

    .footer-links {
        margin-top: 25px;
        font-size: 14px;
    }

    .footer-links a {
        color: var(--primary-blue);
        text-decoration: none;
        font-weight: bold;
    }
  </style>
</head>
<body>

<div class="login-container">
  <h2>Welcome Back</h2>
  <p class="subtitle">Enter your credentials to access your courses.</p>

  <div class="form-group">
    <label>Email</label>
    <input type="email" id="email" placeholder="e.g. aman@gmail.com">
  </div>

  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Password">
  </div>

  <button class="login-btn" onclick="loginUser()">Login</button>
  
  <div id="errorMsg" class="error"></div>

  <div class="divider">or</div>

  <button class="social-btn">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="18">
    Continue with Google
  </button>

  <div class="footer-links">
      Don't have an account? <a href="#">Sign Up</a>
  </div>
</div>

<script>
function loginUser() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const errorDiv = document.getElementById("errorMsg");

  // Demo credentials
  const validEmail = "aman@gmail.com";
  const validPassword = "12345";

  if(email === validEmail && password === validPassword) {
      localStorage.setItem("user", email);
      window.location.href = "dashboard.html";
  } else {
      errorDiv.style.display = "block";
      errorDiv.innerText = "The email or password you entered is incorrect.";
  }
}
</script>

</body>
</html>
